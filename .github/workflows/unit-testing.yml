name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  node-version: '22'
  npm_config_DATASET_ID: d4abb40e-22d4-4eb7-b48e-5325b7ce2a1f
  npm_config_SERVER_URL: https://sandbox-api.relewise.com/
  npm_config_TEST_RECENTLY_PURCHASED_FACET: 'false'

# Persistent fixtures are shared by all runs against this dedicated dataset.
concurrency:
  group: javascript-sdk-integration-dataset
  cancel-in-progress: false

jobs:
  test-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/client
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
      - run: npm ci
        name: Install dependencies
      - run: npm run gen-api 
        name: Generate API type defs
      - run: npm run build
        name: Build
      - run: npm run build:types
        name: Build Types
      - run: npm test
        name: Unit tests
      - run: npm run integration-seed
        env:
          npm_config_API_KEY: ${{ secrets.INTEGRATION_TESTS_DATASET_API_KEY }}
        name: Create or update integration fixtures
      - run: npm run integration-test
        env:
          npm_config_API_KEY: ${{ secrets.INTEGRATION_TESTS_DATASET_API_KEY }}
        name: Integration tests
  
  test-integrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/integrations
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
      - run: npm ci
        name: Install dependencies
      - run: npm run build
        name: Build
      - run: npm test
        name: Unit tests
      - run: npm run integration-test
        env:
          npm_config_API_KEY: ${{ secrets.INTEGRATION_TESTS_DATASET_API_KEY }}
        name: Integration tests
